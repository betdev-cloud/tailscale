name: Sync tags

on:
  pull_request:
    paths:
      - "sync_tags.py"
      - "github_utils.py"
      - ".github/workflows/sync-tags.yml"

  schedule:
    - cron: '0 * * * *'

  workflow_dispatch:

jobs:
  sync_tags_dry_run:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.x

      - name: Install dependencies
        run: |
          python -m pip install requests

      - name: Run sync in dry-run mode
        run: |
          python sync_tags.py --dry-run

  sync_tags:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.x

      - name: Install dependencies
        run: |
          python -m pip install requests

      - name: Sync tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python sync_tags.py
